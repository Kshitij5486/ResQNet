version: '3.8'

services:

  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: postgres:16.3-alpine
    container_name: resqnet-postgres
    environment:
      POSTGRES_DB:       emergency_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - resqnet

  redis:
    image: redis:7.4-alpine
    container_name: resqnet-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - resqnet

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: resqnet-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - resqnet

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: resqnet-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:       PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
      KAFKA_NUM_PARTITIONS:                   3
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout:  10s
      retries:  5
    networks:
      - resqnet

  # ── Microservices ────────────────────────────────────────────
  user-service:
    build:
      context:    ./services/user-service
      dockerfile: Dockerfile
    container_name: resqnet-user-service
    image: resqnet/user-service:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL:  jdbc:postgresql://postgres:5432/emergency_db
      JWT_SECRET:             dev-secret-replace-in-production
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 60s
    networks:
      - resqnet
    restart: unless-stopped

  emergency-service:
    build:
      context:    ./services/emergency-service
      dockerfile: Dockerfile
    container_name: resqnet-emergency-service
    image: resqnet/emergency-service:latest
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE:           docker
      SPRING_DATASOURCE_URL:            jdbc:postgresql://postgres:5432/emergency_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS:   kafka:9092
      JWT_SECRET:                       dev-secret-replace-in-production
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/api/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 60s
    networks:
      - resqnet
    restart: unless-stopped

  dispatch-service:
    build:
      context:    ./services/dispatch-service
      dockerfile: Dockerfile
    container_name: resqnet-dispatch-service
    image: resqnet/dispatch-service:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE:           docker
      SPRING_DATASOURCE_URL:            jdbc:postgresql://postgres:5432/emergency_db
      SPRING_DATA_REDIS_HOST:           redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS:   kafka:9092
      JWT_SECRET:                       dev-secret-replace-in-production
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/api/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 60s
    networks:
      - resqnet
    restart: unless-stopped

  api-gateway:
    build:
      context:    ./services/api-gateway
      dockerfile: Dockerfile
    container_name: resqnet-api-gateway
    image: resqnet/api-gateway:latest
    depends_on:
      user-service:
        condition: service_healthy
      emergency-service:
        condition: service_healthy
      dispatch-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET:             dev-secret-replace-in-production
      USER_SERVICE_URL:       http://user-service:8081
      EMERGENCY_SERVICE_URL:  http://emergency-service:8082
      DISPATCH_SERVICE_URL:   http://dispatch-service:8083
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 90s
    networks:
      - resqnet
    restart: unless-stopped

  ai-service:
    build:
      context:    ./services/ai-service
      dockerfile: Dockerfile
    container_name: resqnet-ai-service
    image: resqnet/ai-service:latest
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DATABASE_URL:    postgresql://postgres:postgres@postgres:5432/emergency_db
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/api/ai/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 60s
    networks:
      - resqnet
    restart: unless-stopped

  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
    container_name: resqnet-frontend
    image: resqnet/frontend:latest
    depends_on:
      - api-gateway
      - ai-service
    ports:
      - "80:80"
    networks:
      - resqnet
    restart: unless-stopped

# ── Volumes ─────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:

# ── Networks ─────────────────────────────────────────────────────
networks:
  resqnet:
    driver: bridge