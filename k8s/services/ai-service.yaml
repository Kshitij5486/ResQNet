apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: resqnet
  labels:
    app:     ai-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app:     ai-service
        version: v1
    spec:
      containers:
        - name:  ai-service
          image: resqnet/ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka-service:9092
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres-service:5432/emergency_db
          readinessProbe:
            httpGet:
              path: /api/ai/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds:       10
          livenessProbe:
            httpGet:
              path: /api/ai/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds:       15
          resources:
            requests:
              memory: "512Mi"
              cpu:    "300m"
            limits:
              memory: "1Gi"
              cpu:    "600m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: resqnet
spec:
  selector:
    app: ai-service
  ports:
    - port:       8084
      targetPort: 8084
  type: ClusterIP