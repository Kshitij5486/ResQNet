apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: resqnet
  labels:
    app:     user-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app:     user-service
        version: v1
    spec:
      containers:
        - name:  user-service
          image: resqnet/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/emergency_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: resqnet-secrets
                  key:  POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resqnet-secrets
                  key:  POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: resqnet-secrets
                  key:  JWT_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds:       10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds:       15
          resources:
            requests:
              memory: "256Mi"
              cpu:    "200m"
            limits:
              memory: "512Mi"
              cpu:    "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: resqnet
spec:
  selector:
    app: user-service
  ports:
    - port:       8081
      targetPort: 8081
  type: ClusterIP