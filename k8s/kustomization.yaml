apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: resqnet

resources:
  # Base
  - base/namespace.yaml
  - base/configmap.yaml
  - base/secrets.yaml
  - base/hpa.yaml
  - base/ingress.yaml
  - base/resource-quota.yaml

  # Infrastructure
  - infrastructure/postgres.yaml
  - infrastructure/redis.yaml
  - infrastructure/kafka.yaml

  # Services
  - services/user-service.yaml
  - services/emergency-service.yaml
  - services/dispatch-service.yaml
  - services/api-gateway.yaml
  - services/ai-service.yaml
  - services/frontend.yaml

commonLabels:
  app.kubernetes.io/name:       resqnet
  app.kubernetes.io/version:    "1.0.0"
  app.kubernetes.io/managed-by: kustomize