apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resqnet-ingress
  namespace: resqnet
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target:        /
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout:    "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout:    "60"
    nginx.ingress.kubernetes.io/proxy-body-size:       "10m"
    nginx.ingress.kubernetes.io/ssl-redirect:          "false"
spec:
  ingressClassName: nginx
  rules:
    - host: resqnet.local
      http:
        paths:
          # Frontend
          - path:     /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

          # API Gateway routes
          - path:     /api/auth
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

          - path:     /api/incidents
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

          # Dispatch Service routes
          - path:     /api/responders
            pathType: Prefix
            backend:
              service:
                name: dispatch-service
                port:
                  number: 8083

          - path:     /api/monitoring
            pathType: Prefix
            backend:
              service:
                name: dispatch-service
                port:
                  number: 8083

          - path:     /api/health/stats
            pathType: Prefix
            backend:
              service:
                name: dispatch-service
                port:
                  number: 8083

          # Emergency Service routes
          - path:     /api/health
            pathType: Prefix
            backend:
              service:
                name: emergency-service
                port:
                  number: 8082

          # AI Service routes
          - path:     /api/ai
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 8084