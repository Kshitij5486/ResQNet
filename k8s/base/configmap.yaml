apiVersion: v1
kind: ConfigMap
metadata:
  name: resqnet-config
  namespace: resqnet
data:
  POSTGRES_DB:                emergency_db
  POSTGRES_HOST:              postgres-service
  POSTGRES_PORT:              "5432"
  KAFKA_BOOTSTRAP_SERVERS:    kafka-service:9092
  REDIS_HOST:                 redis-service
  REDIS_PORT:                 "6379"
  USER_SERVICE_URL:           http://user-service:8081
  EMERGENCY_SERVICE_URL:      http://emergency-service:8082
  DISPATCH_SERVICE_URL:       http://dispatch-service:8083
  AI_SERVICE_URL:             http://ai-service:8084
  SPRING_PROFILES_ACTIVE:     docker