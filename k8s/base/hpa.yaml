# HPA for Emergency Service - scales on CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: emergency-service-hpa
  namespace: resqnet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       emergency-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:               Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type:               Utilization
          averageUtilization: 80
---
