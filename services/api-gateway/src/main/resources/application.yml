server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: emergency-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/incidents/**
          filters:
            - StripPrefix=0

        - id: dispatch-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/responders/**
          filters:
            - StripPrefix=0

jwt:
  secret: change-this-to-a-256-bit-secret

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.emergency: DEBUG
    org.springframework.cloud.gateway: INFO