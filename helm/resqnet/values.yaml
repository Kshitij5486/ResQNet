# ResQNet Helm Chart Values
# Override these in values-prod.yaml or values-dev.yaml

global:
  namespace:    resqnet
  imageRegistry: resqnet
  imagePullPolicy: IfNotPresent

# ── Infrastructure ───────────────────────────────────────────
postgres:
  enabled:  true
  image:    postgres:16.3-alpine
  storage:  5Gi
  database: emergency_db
  username: postgres
  password: postgres
  resources:
    requests:
      memory: "256Mi"
      cpu:    "250m"
    limits:
      memory: "512Mi"
      cpu:    "500m"

redis:
  enabled: true
  image:   redis:7.4-alpine
  storage: 1Gi
  resources:
    requests:
      memory: "128Mi"
      cpu:    "100m"
    limits:
      memory: "256Mi"
      cpu:    "200m"

kafka:
  enabled:    true
  image:      confluentinc/cp-kafka:7.6.0
  partitions: 3
  resources:
    requests:
      memory: "512Mi"
      cpu:    "300m"
    limits:
      memory: "1Gi"
      cpu:    "600m"

zookeeper:
  image: confluentinc/cp-zookeeper:7.6.0
  resources:
    requests:
      memory: "256Mi"
      cpu:    "200m"
    limits:
      memory: "512Mi"
      cpu:    "400m"

# ── Services ─────────────────────────────────────────────────
userService:
  enabled:  true
  replicas: 2
  image:    user-service
  tag:      latest
  port:     8081
  resources:
    requests:
      memory: "256Mi"
      cpu:    "200m"
    limits:
      memory: "512Mi"
      cpu:    "500m"
  hpa:
    enabled:    true
    minReplicas: 2
    maxReplicas: 6
    cpuTarget:  70

emergencyService:
  enabled:  true
  replicas: 2
  image:    emergency-service
  tag:      latest
  port:     8082
  resources:
    requests:
      memory: "256Mi"
      cpu:    "200m"
    limits:
      memory: "512Mi"
      cpu:    "500m"
  hpa:
    enabled:     true
    minReplicas: 2
    maxReplicas: 8
    cpuTarget:   70

dispatchService:
  enabled:  true
  replicas: 2
  image:    dispatch-service
  tag:      latest
  port:     8083
  resources:
    requests:
      memory: "256Mi"
      cpu:    "200m"
    limits:
      memory: "512Mi"
      cpu:    "500m"
  hpa:
    enabled:     true
    minReplicas: 2
    maxReplicas: 6
    cpuTarget:   70

apiGateway:
  enabled:  true
  replicas: 2
  image:    api-gateway
  tag:      latest
  port:     8080
  resources:
    requests:
      memory: "256Mi"
      cpu:    "200m"
    limits:
      memory: "512Mi"
      cpu:    "500m"
  hpa:
    enabled:     true
    minReplicas: 2
    maxReplicas: 6
    cpuTarget:   70

aiService:
  enabled:  true
  replicas: 1
  image:    ai-service
  tag:      latest
  port:     8084
  resources:
    requests:
      memory: "512Mi"
      cpu:    "300m"
    limits:
      memory: "1Gi"
      cpu:    "600m"
  hpa:
    enabled:     false

frontend:
  enabled:  true
  replicas: 2
  image:    frontend
  tag:      latest
  port:     80
  resources:
    requests:
      memory: "64Mi"
      cpu:    "50m"
    limits:
      memory: "128Mi"
      cpu:    "100m"
  hpa:
    enabled:     true
    minReplicas: 2
    maxReplicas: 4
    cpuTarget:   80

# ── Security ─────────────────────────────────────────────────
secrets:
  jwtSecret: dev-secret-replace-in-production

# ── Ingress ──────────────────────────────────────────────────
ingress:
  enabled:   true
  className: nginx
  host:      resqnet.local
  tls:       false