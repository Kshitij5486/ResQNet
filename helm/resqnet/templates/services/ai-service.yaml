apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ai-service
    {{- include "resqnet.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.aiService.replicas }}
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name:  ai-service
          image: {{ .Values.global.imageRegistry }}/{{ .Values.aiService.image }}:{{ .Values.aiService.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.aiService.port }}
          env:
            - name:  KAFKA_BOOTSTRAP
              value: kafka-service:9092
            - name:  DATABASE_URL
              value: postgresql://postgres:postgres@postgres-service:5432/emergency_db
          readinessProbe:
            httpGet:
              path: /api/ai/health
              port: {{ .Values.aiService.port }}
            initialDelaySeconds: 30
            periodSeconds:       10
          resources:
            {{- toYaml .Values.aiService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: ai-service
  ports:
    - port:       {{ .Values.aiService.port }}
      targetPort: {{ .Values.aiService.port }}
  type: ClusterIP