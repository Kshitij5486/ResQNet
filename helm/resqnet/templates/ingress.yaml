{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resqnet-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "resqnet.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout:    "60"
    {{- if .Values.ingress.tls }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path:     /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path:     /api/auth
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: {{ .Values.apiGateway.port }}
          - path:     /api/incidents
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: {{ .Values.apiGateway.port }}
          - path:     /api/responders
            pathType: Prefix
            backend:
              service:
                name: dispatch-service
                port:
                  number: {{ .Values.dispatchService.port }}
          - path:     /api/health
            pathType: Prefix
            backend:
              service:
                name: emergency-service
                port:
                  number: {{ .Values.emergencyService.port }}
          - path:     /api/ai
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: {{ .Values.aiService.port }}
{{- end }}